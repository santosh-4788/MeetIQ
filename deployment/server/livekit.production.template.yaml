# LiveKit server - PRODUCTION (generated by install-oneinsure-connect.ps1; __PUBLIC_IP__, __MEDIA_IP__, __API_KEY__ replaced).
# The API key NAME is not secret; the secret comes only from the LIVEKIT_KEYS environment variable of the
# OneInsureConnectVideo service (registry), never from this file.
#
# Signalling (HTTP/WebSocket 7880) stays on loopback: browsers reach it through IIS (https://<domain>/rtc).
# Media is direct: TCP 7881 and UDP 7882 must be reachable from the internet on __PUBLIC_IP__
# (firewall + NAT port forwarding - network team approval required, see FIREWALL_AND_NETWORK_REQUIREMENTS.md).

port: 7880
bind_addresses:
  - 127.0.0.1

rtc:
  tcp_port: 7881
  # One UDP port with ICE/UDP multiplexing (one firewall/NAT rule).
  udp_port: 7882
  use_external_ip: false
  # The address browsers use to reach this server's media ports (public IP, or the NAT's public IP).
  node_ip: __PUBLIC_IP__
  # Only gather ICE candidates on the server's media network card (not Hyper-V/VPN adapters).
  ips:
    includes:
      - __MEDIA_IP__/32

room:
  empty_timeout: 300
  departure_timeout: 20
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/h264

logging:
  level: info
  json: false

# Signed room events (attendance, room finished) to the API on loopback.
webhook:
  api_key: __API_KEY__
  urls:
    - http://127.0.0.1:5000/api/v1/webhooks/livekit
